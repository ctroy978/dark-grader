# GradeForge — nginx locations for http://<server>/gradeforge/
#
# This box already hosts other sites on /. Do NOT add a second
# `server { listen 80; }` that fights the existing default site.
#
# Install:
#   1. Paste the map{} block into the `http { }` section of
#      /etc/nginx/nginx.conf if one is not already there
#      (duplicate `map $http_upgrade` will fail nginx -t).
#   2. Copy the two `location` blocks into the existing
#      `server { listen 80; ... }` that students already hit.
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Node listens on 127.0.0.1:3001 and expects the /gradeforge prefix
# (BASE_PATH=/gradeforge). Do not strip the prefix on proxy_pass.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- paste the rest into your existing server { listen 80; } ----

    location = /gradeforge {
        return 301 /gradeforge/;
    }

    location /gradeforge/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Fights stay on Socket.IO for a whole class period.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
