[[attacks]]
id = "FrontSlam"
weight = 3
sfx = "boss_warden_slam"
bubble_lines = ["Kneel!", "Barrow falls!", "Front!"]
use_grunt = true

[[attacks]]
id = "LineAttack"
weight = 2
sfx = "boss_warden_line"
bubble_lines = ["Frost wave!", "All of you!", "Cold!"]
use_grunt = true

[[attacks]]
id = "SpreadingFrost"
weight = 4
sfx = "boss_warden_frost"
bubble_lines = ["Freeze!", "Ice takes you!", "Shatter soon…", "Hold still!"]
use_laugh = true

# Light stall so pure DPS races are harder (no Cascade / adds in v1)
[[attacks]]
id = "Regenerate"
weight = 1
sfx = "boss_warden_slam"
bubble_lines = ["The barrow mends…", "Cold flesh knits!", "Not yet!"]
use_grunt = true
