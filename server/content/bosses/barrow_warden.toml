# Room 5 — Barrow Warden (frost signature).
# North/South Wind = directional chill weather; SpreadingFrost = always freeze + shatter punish.
# Crack Frozen with an A on a frozen hero. See docs/WARDEN_WINDS_PLAN.md.

id = "barrow_warden"
name = "Barrow Warden"
max_hp = 210
traits = ["Frost"]
difficulty = "Hard"
summary = "Weather and ice. North/South Wind chill the front or back; Spreading Frost always freezes someone up front — crack free with an A before it shatters."
recommended_rounds = "10–14"
enrage_hp_pct = 0.25
enrage_damage_mult = 1.15

grunt_pool = ["boss_warden_grunt_1", "boss_warden_grunt_2"]
laugh_pool = ["boss_warden_laugh"]
telegraph_sfx = "boss_warden_telegraph"

[[audio]]
id = "boss_warden_grunt_1"
kind = "sfx"
text = "low cold grave wind whoosh short, barrow warden frost, dark fantasy classroom safe, no words"
duration_seconds = 0.65
volume = 0.55

[[audio]]
id = "boss_warden_grunt_2"
kind = "sfx"
text = "soft ice scrape grunt short, undead frost warden, restrained, no words"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_warden_laugh"
kind = "sfx"
text = "short hollow ethereal chuckle over ice crackle, barrow warden, not scary for classroom, no words"
duration_seconds = 0.85
volume = 0.5

[[audio]]
id = "boss_warden_telegraph"
kind = "sfx"
text = "cold frost wind wind-up, ice crystals forming, short tension, dark fantasy, no voice"
duration_seconds = 1.5
volume = 0.55

[[audio]]
id = "boss_warden_slam"
kind = "sfx"
text = "heavy frosted barrow slam impact, ice and stone, medium hit, no voice"
duration_seconds = 1.0
volume = 0.55

[[audio]]
id = "boss_warden_line"
kind = "sfx"
text = "line of frost dust whoosh, medium fantasy hit, no voice"
duration_seconds = 1.0
volume = 0.55

[[audio]]
id = "boss_warden_frost"
kind = "sfx"
text = "spreading ice crackle freeze pulse, crystalline whoosh, ominous short, no voice"
duration_seconds = 1.5
volume = 0.55

[[attacks]]
id = "NorthWind"
weight = 3
sfx = "boss_warden_slam"
bubble_lines = ["North wind!", "Front freezes!", "Gale!"]
use_grunt = true

[[attacks]]
id = "SouthWind"
weight = 2
sfx = "boss_warden_line"
bubble_lines = ["South wind!", "Rear freezes!", "Back gale!"]
use_grunt = true

[[attacks]]
id = "SpreadingFrost"
weight = 3
sfx = "boss_warden_frost"
bubble_lines = ["Freeze!", "Ice takes you!", "Shatter soon…", "Hold still!"]
use_laugh = true

# Light stall so pure DPS races are harder (no Cascade / adds in v1)
[[attacks]]
id = "Regenerate"
weight = 1
sfx = "boss_warden_slam"
bubble_lines = ["The barrow mends…", "Cold flesh knits!", "Not yet!"]
use_grunt = true
