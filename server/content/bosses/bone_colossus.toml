# Boss definition — add new bosses by copying this file.
# Attack *mechanics* live in code (attack id registry); this file picks which
# attacks the boss uses, weights, lines, and ElevenLabs audio.

id = "bone_colossus"
name = "Bone Colossus"
max_hp = 230
traits = ["Undead", "Bone Ward", "Enrage"]
difficulty = "Hard"
summary = "A towering skeleton sealed by a Bone Ward. It swings the remains of ancient giants as weapons while something restless stirs inside its frame."
encounter_hint = "The Colossus does not stand alone. Old battles stir beneath its ribs, and its Bone Ward may have to be broken before the giant can be fully harmed."
recommended_rounds = "12–18"
tempo_round_limit = 18
enrage_hp_pct = 0.4
enrage_damage_mult = 1.3

# Top-level pools MUST appear before [[audio]] / [[attacks]] tables
grunt_pool = ["boss_bone_grunt_1", "boss_bone_grunt_2"]
laugh_pool = ["boss_bone_laugh"]
telegraph_sfx = "boss_bone_telegraph"

