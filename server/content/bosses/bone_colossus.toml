# Boss definition — add new bosses by copying this file.
# Attack *mechanics* live in code (attack id registry); this file picks which
# attacks the boss uses, weights, lines, and ElevenLabs audio.

id = "bone_colossus"
name = "Bone Colossus"
max_hp = 230
traits = ["Undead", "Enrage"]
difficulty = "Hard"
summary = "Lower HP but Bone Archers tax damage (minions die first). Cascade, poison, magnet crush. Enrages below 40% HP."
recommended_rounds = "10–16"
enrage_hp_pct = 0.4
enrage_damage_mult = 1.3

# Top-level pools MUST appear before [[audio]] / [[attacks]] tables
grunt_pool = ["boss_bone_grunt_1", "boss_bone_grunt_2"]
laugh_pool = ["boss_bone_laugh"]
telegraph_sfx = "boss_bone_telegraph"

[[audio]]
id = "boss_bone_grunt_1"
kind = "sfx"
text = "deep undead bone giant short grunt, dark fantasy, restrained, classroom safe, no voice words"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_bone_grunt_2"
kind = "sfx"
text = "heavy skeletal roar grunt short, bone colossus, dark fantasy game, no words"
duration_seconds = 0.75
volume = 0.55

[[audio]]
id = "boss_bone_laugh"
kind = "sfx"
text = "short sinister skeleton laugh, dry bones, dark fantasy, not scary for classroom, no words"
duration_seconds = 0.9
volume = 0.5

[[audio]]
id = "boss_bone_telegraph"
