[[attacks]]
id = "FrontSlam"
name = "Bone Hammer"
description = "He uses a giant leg bone to smash the front three positions. The impact is strongest in position 1 and weakens through positions 2 and 3."
weight = 3
sfx = "boss_bone_slam"
bubble_lines = ["BONE HAMMER!", "Front line—break!", "CRUSH!"]
use_grunt = true

[[attacks]]
id = "LineAttack"
name = "Marrow Sweep"
description = "He swings the giant bone across the entire party line, dealing the same direct hit to every living hero."
weight = 2
sfx = "boss_bone_line"
bubble_lines = ["MARROW SWEEP!", "All of you!"]
use_grunt = true

[[attacks]]
id = "Cascade"
name = "Bonefall"
description = "He shatters a mass of bones into a wave that crashes through every position from front to back. It hits the front hardest and the back lightest."
weight = 4
sfx = "boss_bone_cascade"
bubble_lines = ["BONEFALL!", "Front to back!", "Fall in order!"]
use_grunt = true
use_laugh = true

[[attacks]]
id = "CrushMagnet"
name = "Grave Pin"
description = "He drives a sharpened bone at the hero on the Token Magnet and strikes both adjacent positions for smaller damage."
weight = 3
sfx = "boss_bone_crush"
bubble_lines = ["GRAVE PIN!", "There!", "Pin the glow!"]
use_grunt = true

