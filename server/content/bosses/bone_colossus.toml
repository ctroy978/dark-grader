[[attacks]]
id = "FrontSlam"
weight = 3
sfx = "boss_bone_slam"
bubble_lines = ["CRUSH!", "Front line—break!", "SLAM!"]
use_grunt = true

[[attacks]]
id = "LineAttack"
weight = 2
sfx = "boss_bone_line"
bubble_lines = ["All of you!", "Sweep!"]
use_grunt = true

[[attacks]]
id = "Cascade"
weight = 4
sfx = "boss_bone_cascade"
bubble_lines = ["Front to back!", "CASCADE!", "Fall in order!"]
use_grunt = true
use_laugh = true

[[attacks]]
id = "CrushMagnet"
weight = 3
sfx = "boss_bone_crush"
bubble_lines = ["The magnet dies!", "There!", "Crush the glow!"]
use_grunt = true

[[attacks]]
id = "SummonBoneArchers"
weight = 3
sfx = "boss_bone_summon"
bubble_lines = ["Rise, archers!", "Bones—fire!", "Fill the gap!"]
use_laugh = true

[[attacks]]
id = "PoisonCloud"
weight = 3
sfx = "boss_bone_poison"
bubble_lines = ["Breathe deep…", "Poison!", "Choke!"]
