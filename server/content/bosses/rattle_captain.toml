# Room 4 — electric magnet-seat tax. Practice adds + shock control before Colossus.
# See docs/BOSS_PLAN.md §5.4 (electric revision)

id = "rattle_captain"
name = "Rattle Captain"
# Room 4 should step up past Cinder (170 HP, enrage 30% ×1.2).
max_hp = 200
traits = ["Shock", "StunImmune", "Summoner"]
difficulty = "Standard"
summary = "Rattle Captain's attacks focus on whoever stands over the token magnet. Spark jolts the front of the line and often stuns the fighter under the magnet for their next turn. Grounded is her big one — a surge that hits hardest on the magnet seat and fades as it travels along the line, sometimes stunning nearby seats too. She calls Ohms into the gap; they sometimes raise a short reflect field that bounces hits back at attackers."
recommended_rounds = "8–12"
# Enrages earlier and harder than Cinder so the room curve steps up
enrage_hp_pct = 0.35
enrage_damage_mult = 1.25

grunt_pool = ["boss_rattle_spark_1", "boss_rattle_spark_2"]
laugh_pool = ["boss_rattle_laugh"]
telegraph_sfx = "boss_rattle_telegraph"

[[audio]]
id = "boss_rattle_spark_1"
kind = "sfx"
text = "short electric crackle zap, yellow lightning snap, dark fantasy classroom safe, no words"
duration_seconds = 0.65
volume = 0.55

[[audio]]
id = "boss_rattle_spark_2"
kind = "sfx"
text = "short static zap, restrained thunder rattle, no words"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_rattle_laugh"
kind = "sfx"
text = "short electric crackling chuckle, not scary for classroom, no words"
duration_seconds = 0.85
volume = 0.5

[[audio]]
id = "boss_rattle_telegraph"
kind = "sfx"
text = "building electric wind-up, yellow sparks and tension, dark fantasy, no voice"
duration_seconds = 2.0
volume = 0.55

[[audio]]
id = "boss_rattle_slam"
kind = "sfx"
text = "electric front spark slam impact, lightning, solid medium hit, no voice"
duration_seconds = 1.0
volume = 0.55

[[audio]]
id = "boss_rattle_line"
kind = "sfx"
text = "line of yellow lightning along the party, crackling arc whoosh, no voice"
duration_seconds = 1.0
volume = 0.55

[[audio]]
id = "boss_rattle_cascade"
kind = "sfx"
text = "epic cascading lightning impacts front to back, rising electric stings, long, dark fantasy, no voice"
duration_seconds = 3.0
volume = 0.65

[[audio]]
id = "boss_rattle_crush"
kind = "sfx"
text = "focused lightning crush on the magnet seat, weighty electric thud, no voice"
duration_seconds = 2.0
volume = 0.6

[[audio]]
id = "boss_rattle_summon"
kind = "sfx"
text = "tiny ohm sparklings crackling into the gap, short fantasy summon, no voice"
duration_seconds = 0.9
volume = 0.5

# Stun kits: RattleSpark (main, 60% magnet-seat stun) + Grounded (rare big kit)
# Non-stun: Arc, Crush, Summon — forced after any stun kit

[[attacks]]
id = "RattleSpark"
weight = 5
sfx = "boss_rattle_slam"
bubble_lines = ["Spark!", "Front arcs!", "Rattle!"]
use_grunt = true

[[attacks]]
id = "ArcAttack"
weight = 2
sfx = "boss_rattle_line"
bubble_lines = ["Arc!", "All spark!", "Wave!"]
use_grunt = true

[[attacks]]
id = "Grounded"
weight = 2
sfx = "boss_rattle_cascade"
bubble_lines = ["Grounded!", "Magnet charge!", "Hold the line!"]
use_laugh = true

[[attacks]]
id = "CrushMagnet"
weight = 1
sfx = "boss_rattle_crush"
bubble_lines = ["Magnet!", "Crush the glow!", "There!"]
use_grunt = true

[[attacks]]
id = "SummonOhms"
weight = 2
sfx = "boss_rattle_summon"
bubble_lines = ["Ohms!", "Fill the gap!", "Sparks!"]
use_laugh = true
minion_id = "ohm"
minion_name = "Ohm"
minion_max_hp = 9
minion_damage = 4
minion_max_count = 2
free_volley = false
open_count = 1
minion_shot_sfx = "minion_bone_archer"
minion_shot_bubble = "Zap!"
