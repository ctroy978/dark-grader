# Room 4 — electric magnet-seat tax. Practice adds + shock control before Colossus.
# See docs/BOSS_PLAN.md §5.4 (electric revision)

id = "rattle_captain"
name = "Rattle Captain"
max_hp = 190
traits = ["Shock", "StunImmune", "Summoner"]
difficulty = "Standard"
summary = "Electric captain. Rattle Spark may stun whoever stands under the Token Magnet; Cascade may stun the magnet seat and both neighbors (wrap). Magnet still moves. Thundercallers trade half damage and ignore stuns both ways. Weak Ohms in the gap."
recommended_rounds = "8–12"
enrage_hp_pct = 0.4
enrage_damage_mult = 1.2

grunt_pool = ["boss_rattle_spark_1", "boss_rattle_spark_2"]
laugh_pool = ["boss_rattle_laugh"]
telegraph_sfx = "boss_rattle_telegraph"

[[audio]]
id = "boss_rattle_spark_1"
kind = "sfx"
text = "short electric crackle zap, yellow lightning snap, dark fantasy classroom safe, no words"
duration_seconds = 0.65
volume = 0.55

[[audio]]
id = "boss_rattle_spark_2"
