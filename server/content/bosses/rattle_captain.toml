# Stun kits: RattleSpark (magnet-seat stun %) + Cascade (magnet + neighbors %)
# Non-stun: Line, Crush, Summon — forced after any stun kit

[[attacks]]
id = "RattleSpark"
weight = 3
sfx = "boss_rattle_slam"
bubble_lines = ["Spark!", "Front arcs!", "Rattle!"]
use_grunt = true

[[attacks]]
id = "LineAttack"
weight = 2
sfx = "boss_rattle_line"
bubble_lines = ["Arc line!", "All spark!", "Wave!"]
use_grunt = true

[[attacks]]
id = "Cascade"
weight = 2
sfx = "boss_rattle_cascade"
bubble_lines = ["Cascade!", "Front charge!", "Hold still!"]
use_laugh = true

[[attacks]]
id = "CrushMagnet"
weight = 3
sfx = "boss_rattle_crush"
bubble_lines = ["Magnet!", "Crush the glow!", "There!"]
use_grunt = true

[[attacks]]
id = "SummonOhms"
weight = 3
sfx = "boss_rattle_summon"
bubble_lines = ["Ohms!", "Fill the gap!", "Sparks!"]
use_laugh = true
minion_id = "ohm"
minion_name = "Ohm"
minion_max_hp = 8
minion_damage = 2
minion_max_count = 2
free_volley = false
open_count = 1
minion_shot_sfx = "minion_bone_archer"
minion_shot_bubble = "Zap!"
