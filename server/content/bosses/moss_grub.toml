# Room 1 tutorial boss — real pressure, learn the loop (and that deaths stick).
# Hits hard enough to drop 1–2 party members if students sleep / ignore mites.
# Still no Cascade / Poison / Crush / enrage. See docs/BOSS_PLAN.md §5.1

id = "moss_grub"
name = "Moss Grub"
max_hp = 130
traits = ["Tutorial"]
difficulty = "Easy"
summary = "Opening fight that can still kill. Front slams and line sweeps only — no cascade, poison, or regen. Moss Mites nibble and leave sticky slime until Fire Mage burns it off."
recommended_rounds = "5–8"
# No enrage (mult 1.0 = never amplifies)
enrage_hp_pct = 0.2
enrage_damage_mult = 1.0

grunt_pool = ["boss_grub_chitter_1", "boss_grub_chitter_2"]
laugh_pool = ["boss_grub_gurgle"]
telegraph_sfx = "boss_grub_telegraph"

[[audio]]
id = "boss_grub_chitter_1"
kind = "sfx"
text = "wet mossy insect chitter short, giant grub, dark fantasy, classroom safe, no words"
duration_seconds = 0.65
volume = 0.55

[[audio]]
id = "boss_grub_chitter_2"
kind = "sfx"
text = "soft squelch and chitter, oversized worm grub, restrained, no words"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_grub_gurgle"
kind = "sfx"
text = "short wet gurgle chuckle, moss grub, not scary for classroom, no words"
duration_seconds = 0.8
volume = 0.5

[[audio]]
id = "boss_grub_telegraph"
kind = "sfx"
text = "worm coiling wind-up, damp soil rattle, short tension, no voice"
duration_seconds = 0.75
volume = 0.55

[[audio]]
id = "boss_grub_slam"
kind = "sfx"
text = "soft heavy grub slam impact, wet thud, short game hit, no voice"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_grub_line"
kind = "sfx"
text = "wide wet sweep whoosh of moss and dirt, short, no voice"
duration_seconds = 0.7
volume = 0.5

[[audio]]
id = "boss_grub_summon"
kind = "sfx"
text = "tiny mites skittering out of moss, soft insect chirps, short fantasy summon, no voice"
duration_seconds = 0.85
volume = 0.5

[[attacks]]
id = "LightFrontSlam"
weight = 3
sfx = "boss_grub_slam"
bubble_lines = ["Thump!", "Front falls!", "Squelch!"]
use_grunt = true

[[attacks]]
id = "LightLineAttack"
weight = 2
sfx = "boss_grub_line"
bubble_lines = ["Sweep!", "Moss wave!", "All of you!"]
use_grunt = true

[[attacks]]
id = "SummonMossMites"
weight = 2
sfx = "boss_grub_summon"
bubble_lines = ["Skitter!", "Mites!", "Little ones!"]
use_laugh = true
minion_id = "moss_mite"
minion_name = "Moss Mite"
minion_max_hp = 9
minion_damage = 3
minion_max_count = 2
free_volley = false
open_count = 1
minion_shot_sfx = "minion_moss_mite"
minion_shot_bubble = "Nibble!"
minion_on_hit_dot = "Slime"
minion_on_hit_dot_stacks = 1
