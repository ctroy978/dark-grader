# Room 3 — first real add fight. Clear imps, then the boss.
# See docs/BOSS_PLAN.md §5.3

id = "cinder_herald"
name = "Cinder Herald"
max_hp = 170
traits = ["Fire", "Herald", "Summoner"]
difficulty = "Standard"
summary = "Commands living flame and calls Cinder Imps into the gap. Furnace Fist pressures the front, Searing Wake scorches the line, and Cinderstorm leaves every hero burning."
recommended_rounds = "8–12"
enrage_hp_pct = 0.30
enrage_damage_mult = 1.2

grunt_pool = ["boss_herald_hiss_1", "boss_herald_hiss_2"]
laugh_pool = ["boss_herald_laugh"]
telegraph_sfx = "boss_herald_telegraph"

[[audio]]
id = "boss_herald_hiss_1"
kind = "sfx"
text = "cinder herald short fiery hiss whoosh, ember crackle, dark fantasy, classroom safe, no words"
duration_seconds = 0.65
volume = 0.55

[[audio]]
id = "boss_herald_hiss_2"
kind = "sfx"
text = "smoky herald growl short, hot ash breath, restrained, no words"
duration_seconds = 0.7
volume = 0.55

[[audio]]
id = "boss_herald_laugh"
kind = "sfx"
text = "short smoky ethereal chuckle, cinder herald, not scary for classroom, no words"
duration_seconds = 0.85
volume = 0.5

[[audio]]
id = "boss_herald_telegraph"
kind = "sfx"
text = "embers swirl wind-up for a herald attack, short tension, no voice"
duration_seconds = 0.8
volume = 0.55

[[audio]]
id = "boss_herald_slam"
kind = "sfx"
text = "fiery herald slam impact short, cinder fist, no voice"
duration_seconds = 0.75
volume = 0.55

[[audio]]
id = "boss_herald_line"
kind = "sfx"
text = "line of cinder and spark blast short whoosh, no voice"
duration_seconds = 0.75
volume = 0.55

[[audio]]
id = "boss_herald_summon"
kind = "sfx"
text = "cinder imps skittering out of ash, tiny flame crackles, short fantasy summon, no voice"
duration_seconds = 0.85
volume = 0.5

[[audio]]
id = "boss_herald_fire"
kind = "sfx"
text = "whoosh of cinder fire cloud erupting, crackling embers and heat, short fantasy, no voice"
duration_seconds = 0.85
volume = 0.55

[[attacks]]
id = "FrontSlam"
name = "Furnace Fist"
description = "The Herald slams a blazing fist into the front three positions. The hit is strongest in position 1 and weakens through positions 2 and 3."
weight = 3
sfx = "boss_herald_slam"
bubble_lines = ["Furnace Fist!", "Front burns!", "Kneel!"]
use_grunt = true

[[attacks]]
id = "LineAttack"
name = "Searing Wake"
description = "The Herald sweeps a wave of sparks across the entire party line, dealing the same direct hit to every living hero."
weight = 2
sfx = "boss_herald_line"
bubble_lines = ["Searing Wake!", "All of you!", "Spark line!"]
use_grunt = true

[[attacks]]
id = "FireCloud"
name = "Cinderstorm"
description = "The Herald blankets every living hero in Fire. The burn ticks each round and grows stronger if it is left uncleansed."
weight = 3
sfx = "boss_herald_fire"
bubble_lines = ["Cinderstorm!", "Burn!", "Breathe fire…"]
use_laugh = true

[[attacks]]
id = "SummonCinderImps"
name = "Call the Kindling"
description = "The Herald summons Cinder Imps into the gap. Their fire spit deals damage and leaves Fire on the hero it hits."
weight = 3
sfx = "boss_herald_summon"
bubble_lines = ["Imps!", "Fill the gap!", "Little flames!"]
use_laugh = true
minion_id = "cinder_imp"
minion_name = "Cinder Imp"
minion_max_hp = 14
minion_damage = 3
minion_max_count = 2
free_volley = false
open_count = 1
minion_shot_sfx = "minion_cinder_imp"
minion_shot_bubble = "Spit!"
# Option A: full hit damage + Fire stack on the magnet-biased target
minion_on_hit_dot = "Fire"
minion_on_hit_dot_stacks = 1
